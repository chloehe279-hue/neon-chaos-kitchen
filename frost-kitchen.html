<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰箱 RPG · 冰封后厨</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020b26;color:#f4fbff;font:700 16px system-ui,sans-serif;min-height:100svh;display:grid;place-items:center}main{width:min(100vw,177.78svh);aspect-ratio:16/9;position:relative;overflow:hidden;container-type:inline-size;background:#05154b}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}button{font:inherit;cursor:pointer;color:inherit;background:#112762;border:1px solid #78e7ff;border-radius:7px;touch-action:none}button:hover,button:focus-visible{background:#2357a0;outline:2px solid #ddfcff}button.primary{background:#99efff;color:#061840;border:2px solid #e8ffff;box-shadow:0 4px #1871b4,0 0 22px #5ce8ff80}button.primary:hover{background:#defaff}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}.screen{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 55%,#020d34e3 14%,#081a4a45 76%);padding:4cqw}.panel{width:min(72cqw,960px);padding:2.3cqw 3cqw;background:linear-gradient(155deg,#122c65f5,#07163ff7 62%);border:2px solid #89eaff;border-radius:15px;box-shadow:0 0 0 5px #18368bb3,0 0 36px #3adaff81,inset 0 0 24px #238bde50;text-align:center}.kicker{letter-spacing:.2em;color:#80e9ff;font-size:1.13cqw}h1{font-size:6cqw;line-height:1;margin:.16em 0 .18em;letter-spacing:.05em;text-shadow:0 4px #2d61bb,0 0 20px #31bdffb0}p{font-size:1.5cqw;color:#c9e9ff;margin:.65em 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:.65cqw;margin:1.3cqw 0}.choices button{display:flex;align-items:center;gap:.7cqw;justify-content:flex-start;text-align:left;padding:.5cqw .65cqw;font-size:1.24cqw;min-height:4.2cqw}.choices button[aria-pressed=true]{background:#22629a;border-color:#eaffff;box-shadow:inset 0 0 12px #52ecff62,0 0 10px #50b9ff9e}.choices canvas{flex:none;width:3.3cqw;height:3.3cqw;object-fit:contain;image-rendering:pixelated}.actions{display:flex;justify-content:center;gap:.65cqw;flex-wrap:wrap;margin:1.1cqw 0 .3cqw}.actions button{padding:.55em 1em;font-size:1.36cqw}.hint{font-size:1.1cqw;color:#9ac9ed}.pause{position:absolute;right:1.7%;top:2%;padding:.32em .7em;font-size:1.25cqw;z-index:1}.touch{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);display:none;gap:.5cqw}.touch button{font-size:2cqw;padding:.36em .9em;background:#0b2859f5}.touch button:active{background:#2c80b7}@media(pointer:coarse){.touch:not([hidden]){display:flex}}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
 
.screen{background:radial-gradient(ellipse at 50% 53%,#040e30cc 12%,#05225351 66%,#01073028)}
.panel{background:radial-gradient(ellipse at 50% 0%,#3f6cebb7,#112957ef 46%,#080c3ef5 90%);border:2px solid #c2faff;box-shadow:0 0 0 3px #39b1fa,0 0 0 6px #2735a5,0 0 43px #4ddcff9a,inset 0 0 31px #3793ee83;position:relative}
.panel::before,.panel::after{content:'❄';position:absolute;top:-1.55cqw;height:3.1cqw;width:3.1cqw;display:grid;place-items:center;border-radius:50%;background:radial-gradient(#55dbff,#124eae 72%);border:1px solid #d7fbff;box-shadow:0 0 13px #33d3ff;font-size:2cqw}
.panel::before{left:-1.55cqw}.panel::after{right:-1.55cqw}
h1{color:#efffff;text-shadow:0 2px #279cf4,0 5px #3547aa,0 0 26px #73edffc0}
.choices button{min-height:4.6cqw;box-shadow:inset 0 0 10px #62b7eb44,0 2px #06102c;background:linear-gradient(150deg,#244e9b,#13266b);border-color:#6fbcff}
.choices button:nth-child(3n+1){border-left:3px solid #f793dc}.choices button:nth-child(3n+2){border-left:3px solid #74f6ff}.choices button:nth-child(3n+3){border-left:3px solid #ffd27a}
.choices button canvas{width:3.8cqw;height:3.7cqw;object-fit:contain}
.choices button:hover,.choices button:focus-visible{background:linear-gradient(140deg,#3079b0,#23459c);outline:1px solid #b1f7ff}
</style>
</head>
<body>
<main>
<canvas width="1280" height="720" id="game" tabindex="-1" aria-label="冰箱厨房游戏画面"></canvas>
<button class="pause" id="pause" aria-label="暂停" hidden>Ⅱ</button>
<div class="touch" id="touch" hidden></div>
<div class="screen" id="screen">
<section class="panel" role="dialog" aria-labelledby="title">
<div class="kicker">❄ OFFICE ARCADE / FREEZER KITCHEN ❄</div>
<h1 id="title">冰封后厨</h1>
<p id="copy">选一道办公室冻品，切开、翻炒，再端过湿滑冰面。</p>
<div class="choices" id="choices" aria-label="选择关卡">
<button type="button" data-level="0">冰冻订书机</button>
<button type="button" data-level="1">冰冻老板</button>
<button type="button" data-level="2">冰冻文件夹</button>
<button type="button" data-level="3">冰冻打印机</button>
<button type="button" data-level="4">冰冻键盘</button>
<button type="button" data-level="5">冰冻空调</button>
</div>
<div class="actions" id="actions"></div>
<noscript><p>请用浏览器打开网页并启用 JavaScript。</p></noscript>
<p class="hint" id="hint">WASD / 方向键移动 · Shift 快跑 · 空格操作 · Esc 暂停</p>
</section>
</div>
<div class="sr" id="live" aria-live="polite"></div>
</main>

function artImage(name){

    actions.append(button('继续游戏',pause,'primary'),button('返回选关',home));

function syncTouch(){
  const controls=$('touch');
  const options=({map:[['↑','w'],['←','a'],['↓','s'],['→','d'],['操作',' ']],chop:[['切菜','e']],wok:[['翻炒','e'],['翻面','f']],serve:[['左压','a'],['前进','e'],['右压','d']]})[scene];
  controls.replaceChildren(...options.map(([name,k])=>{
    const b=button(name,()=>{});
    b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input(k);});
    for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>keys.delete(k));
    return b;
  }));
}

  water.length=0;sparks.length=0;
  if(mode)enter(mode);
  else{say('领取 '+dishes[selected][0],C.gold,2);refreshMenu();}
  canvas.focus?.({preventScroll:true});
}
function enter(mode){
  scene=mode;delay=0;toast=null;clearKeys();target=null;water.length=0;sparks.length=0;
  phase={left:limits[mode],cuts:0,swing:0,beat:0,progress:0,flips:0,gate:0,window:0,burn:0,flipLift:0,tilt:0,velocity:0,kick:0,sign:1,pulses:0,jet:0,spray:0,integrity:100};
  refreshMenu();
}
function finish(ok,message){
  result={ok,message};overlay='result';clearKeys();refreshMenu();
}
function complete(grade){
  if(delay>0)return;
  const name={chop:'切菜',wok:'颠锅',serve:'端盘'}[scene];
  evaluations.push({name,grade});
  if(scene==='serve'){finishStep();return;}
  say(grade+'  ·  '+name+'完成',C.gold,1.2);
  burst(640,348,46);delay=.95;clearKeys();
}
function finishStep(){
  if(practice){finish(true,dishes[selected][0]+' · '+evaluations[0].name+'练习完成');return;}
  if(scene==='serve'){scene='map';step=4;finish(true,dishes[selected][0]+' 已出餐 · '+Math.ceil(phase.integrity)+'% 完整度 · 剩余 '+timeText(clock));return;}
  step++;scene='map';phase=null;delay=0;clearKeys();refreshMenu();
  say(step===2?'冻品已拆开，前往霜火炒锅':'已自动装盘，前往出餐通道',C.gold,2.1);
}
function fail(message){
  finish(false,message);
}
function pause(){
  if(overlay==='paused'){overlay='';refreshMenu();return;}
  if(overlay)return;
  overlay='paused';clearKeys();refreshMenu();
}
function project(x,y,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1];
  const t=clamp(((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy),0,1);
  return [a[0]+t*dx,a[1]+t*dy];
}
function nearest(x,y){
  return walkways.map(([a,b])=>project(x,y,a,b)).reduce((best,p)=>Math.hypot(x-p[0],y-p[1])<Math.hypot(x-best[0],y-best[1])?p:best);
}
function route(destination){
  const origin=nearest(player.x,player.y);
  const [endX,endY]=nearest(destination.x,destination.y);
  const points=[...nodes,origin,[endX,endY]], cost=points.map(()=>Infinity), prev=points.map(()=>-1), visited=new Set();
  cost[nodes.length]=0;
  const allowed=(a,b)=>{
    if(a<nodes.length&&b<nodes.length)return links.some(([u,v])=>u===a&&v===b||u===b&&v===a);
    return walkways.some(([u,v])=>[points[a],points[b]].every(([x,y])=>{const p=project(x,y,u,v);return Math.hypot(p[0]-x,p[1]-y)<.5;}));
  };
  for(let i=0;i<points.length;i++){
    const a=cost.reduce((best,v,j)=>!visited.has(j)&&v<(best===-1?Infinity:cost[best])?j:best,-1);
    if(a<0)break;visited.add(a);
    for(let b=0;b<points.length;b++){
      if(visited.has(b)||!allowed(a,b))continue;
      const d=cost[a]+Math.hypot(points[a][0]-points[b][0],points[a][1]-points[b][1]);
      if(d<cost[b]){cost[b]=d;prev[b]=a;}
    }
  }
  const path=[];
  for(let i=points.length-1;i>=0;i=prev[i])path.unshift(points[i]);
  return path;
}
function activate(o){
  if(!o){say('靠近亮起的工作台后按空格');return;}
  if(o.step!==step){say('先完成：'+stageNames[step],C.gold);return;}
  if(step===0){step=1;burst(player.x,player.y-20);say('已领取冻品，前往分解砧板',C.gold,2);return;}
  enter(['','chop','wok','serve'][step]);
}
function closestStation(){
  const station=stations[step];
  return station&&Math.hypot(station.x-player.x,station.y-player.y)<=54?station:null;
}
function onLane(x,y){
  const [a,b]=nearest(x,y);
  return Math.hypot(a-x,b-y)<=walkRadius;
}
function move(dt){
  let dx=Number(is('d','arrowright'))-Number(is('a','arrowleft')),dy=Number(is('s','arrowdown'))-Number(is('w','arrowup'));
  const manual=dx!==0||dy!==0;
  if(manual)target=null;
  const speed=(is('shift')?355:206)*dt;
  if(target){
    const [x,y]=target.path[0];dx=x-player.x;dy=y-player.y;
    if(Math.hypot(dx,dy)<=speed){
      player.x=x;player.y=y;target.path.shift();
      if(!target.path.length){const o=target.station;target=null;if(o)activate(o);}
      return;
    }
  }
  const length=Math.hypot(dx,dy);
  if(!length)return;
  const x=player.x+dx/length*speed,y=player.y+dy/length*speed;
  if(!manual){player.x=x;player.y=y;return;}
  if(onLane(x,y)){
    player.x=x;player.y=y;
  }else if(dx&&onLane(x,player.y)){
    player.x=x;
  }else if(dy&&onLane(player.x,y)){
    player.y=y;
  }
}
function cut(){
  if(delay||phase.beat>0)return;
  phase.cuts++;phase.beat=.22;phase.swing=1;
  burst(550+phase.cuts*7,379,[2,5,8].includes(phase.cuts)?28:12);
  if(phase.cuts===10)complete(phase.left>10?'EXCELLENT':'GOOD');
}
function flip(){
  const p=phase;if(delay)return;
  if(p.window<=0){p.burn=clamp(p.burn+16,0,100);say('时机未到 · 焦糊 +16%',C.red,.65);return;}
  p.flips++;p.gate++;p.window=0;p.flipLift=1;
  burst(653,371,28);say('翻面成功 '+p.flips+' / 2',C.gold,.68);
}
function cook(dt){
  const p=phase,active=is('e');
  p.flipLift=Math.max(0,p.flipLift-dt*2.3);
  if(p.window>0){
    p.window-=dt;if(p.window<=0){fail('错过翻面窗口，冻品烧焦了');return;}
  }else if(active){
    p.progress=Math.min(1,p.progress+dt*.115);
    if(p.gate<2&&p.progress>=[.34,.72][p.gate]){p.progress=[.34,.72][p.gate];p.window=2.8;}
  }
  p.burn=clamp(p.burn+dt*(active?-6:7),0,100);
  if(p.burn>=100){fail('焦糊风险达到 100%，冻品烧焦了');return;}
  if(p.progress>=1&&p.flips===2)complete(p.burn<27?'EXCELLENT':'GOOD');
}
function spawnJet(p){
  p.sign=Math.floor(p.pulses++/2)%2===0?1:-1;p.kick=1;
  p.velocity+=p.sign*(1.25+(1-p.integrity/100)*.29);
  burst(p.sign>0?325:955,475,13);
}
function balance(dt){
  const p=phase,active=is('e')&&p.progress<1;
  const direction=Number(is('d','arrowright'))-Number(is('a','arrowleft'));
  p.kick=Math.max(0,p.kick-dt*2.9);p.jet+=dt;
  if(p.jet>=1.55){p.jet=0;spawnJet(p);}
  p.spray+=dt;
  if(p.spray>=.032){
    p.spray=0;
    for(const sign of [-1,1]){
      const force=sign===p.sign?p.kick:0;
      water.push({x:sign>0?322:958,y:453,vx:sign*(105+Math.random()*115+force*225),vy:-68-Math.random()*82-force*65,life:.38+Math.random()*.31,r:2+Math.random()*4,c:Math.random()<.4?'#efffff':'#51d7ff'});
    }
  }
  const slip=(Math.sin(now*5.4)*.56+Math.sin(now*2.5)*.51)+p.sign*(active?1.8:1.4)+p.sign*p.kick*2.35;
  p.velocity+=(direction*6.6+slip-p.tilt*.74-p.velocity*2.8)*dt;
  p.tilt=clamp(p.tilt+p.velocity*dt,-balanceTrack.maxTilt,balanceTrack.maxTilt);
  if(Math.abs(p.tilt)>1.15)p.velocity*=.87;
  if(Math.abs(p.tilt)>.69)p.integrity=clamp(p.integrity-dt*(16+Math.abs(p.tilt)*15),0,100);
  if(p.integrity<=0){fail('盘子失衡，冻品全洒了');return;}
  if(active)p.progress=Math.min(1,p.progress+dt*(Math.abs(p.tilt)>.65?.084:.121));
  if(p.progress>=1)complete(p.integrity>=85?'EXCELLENT':'GOOD');

}
function tick(dt){
  if(overlay)return;
  if(toast){toast.life-=dt;if(toast.life<=0)toast=null;}
  for(const [list,gravity] of [[sparks,340],[water,370]]){
    for(let i=list.length-1;i>=0;i--){const p=list[i];p.life-=dt;if(p.life<=0){list.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=gravity*dt;}
  }
  if(delay>0){delay-=dt;if(delay<=0)finishStep();return;}
  if(!practice){clock-=dt;if(clock<=0){fail('营业时间到，订单超时');return;}}
  if(scene==='map'){move(dt);return;}
  phase.left-=dt;
  if(phase.left<=0){fail('本步骤超时，请再挑战一次');return;}
  if(scene==='chop'){
    phase.beat=Math.max(0,phase.beat-dt);phase.swing=Math.max(0,phase.swing-dt*6.4);
    if(is('e'))cut();
  }
  if(scene==='wok')cook(dt);
  if(scene==='serve')balance(dt);
}
function input(k){
  if(k==='escape'){pause();return;}
  if(overlay||delay>0)return;
  const first=!keys.has(k);keys.add(k);
  if(!first)return;
  if(scene==='map'&&k===' ')activate(closestStation());
  if(scene==='chop'&&k==='e')cut();
  if(scene==='wok'&&k==='f')flip();
}
const playableKeys=new Set(['w','a','s','d','shift','arrowup','arrowdown','arrowleft','arrowright',' ','e','f','escape']);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!playableKeys.has(k)||overlay&&k!=='escape')return;e.preventDefault();if(k!=='escape'||!e.repeat)input(k);});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',clearKeys);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!overlay)pause();});
canvas.addEventListener('pointerdown',e=>{
  if(overlay||delay>0)return;
  const bounds=canvas.getBoundingClientRect();
  const x=(e.clientX-bounds.left)*W/bounds.width,y=(e.clientY-bounds.top)*H/bounds.height;
  if(scene==='map'){
    const station=stations.find(o=>Math.abs(o.x-x)<64&&y>=o.y-113&&y<=o.y+laneWidth/2);
    if(station&&station.step!==step){say('下一步：'+stageNames[step],C.gold);return;}
    if(!station&&!onLane(x,y))return;
    target={station,path:route(station||{x,y})};
  }else if(scene==='chop')cut();
});
$('pause').addEventListener('click',pause);
for(const [i,card] of Array.from($('choices').children).entries()){
  card.addEventListener('click',()=>{
    if(overlay!=='menu')return;
    selected=i;
    start();
  });
  card.prepend(menuIcon(i));
}
function frame(ms){
  const dt=last?Math.min((ms-last)/1000,.045):0;last=ms;
  if(!overlay||overlay==='menu')now+=dt;
  tick(dt);render();requestAnimationFrame(frame);
}
refreshMenu();requestAnimationFrame(frame);

</script>
